<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="1198.5" height="638.5" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>

  <g fill="none" stroke="#8A9AA8" stroke-width="1.2" stroke-dasharray="6 4">
    <rect x="24" y="24" width="266" height="416" rx="10"/>
    <rect x="320" y="24" width="520" height="416" rx="10"/>
    <rect x="870" y="24" width="306" height="416" rx="10"/>
    <rect x="24" y="460" width="1152" height="156" rx="10"/>
  </g>
  <g font-size="15" fill="#5A6875" letter-spacing="1.2">
    <text x="40" y="48">GEOMETRY AND MESH</text>
    <text x="336" y="48">CODE_ASTER MODELS</text>
    <text x="886" y="48">RESULTS</text>
    <text x="40" y="484">VERIFICATION</text>
  </g>

  <!-- input -->
  <image href="ov_mesh.png" x="57" y="60" width="200" height="240"/>
  <rect x="40" y="312" width="234" height="112" rx="10" fill="#FBE5CF" stroke="#C97A2B" stroke-width="1.5"/>
  <text x="56" y="342" font-size="22" fill="#15202A">PETG-CF housing</text>
  <g font-size="16" fill="#5A6875">
    <text x="56" y="368">NETGEN, 95,358 nodes</text>
    <text x="56" y="390">E = 3.8 to 6.0 GPa</text>
    <text x="56" y="412">motor, electronics as mass</text>
  </g>

  <!-- method -->
  <rect x="336" y="60" width="488" height="176" rx="10" fill="#DCF1EE" stroke="#0D7A6F" stroke-width="1.5"/>
  <text x="356" y="98" font-size="24" fill="#15202A">Modal analysis</text>
  <g font-size="16" fill="#5A6875">
    <text x="356" y="128">CALC_MODES, free-free</text>
    <text x="356" y="152">1 to 1500 Hz, TETRA4 and TETRA10</text>
    <text x="356" y="176">21 modes, Sturm count checked</text>
    <text x="356" y="200">f scales as √E, so one run covers the range</text>
  </g>
  <image href="ov_mode.png" x="700" y="68" width="106" height="159"/>
  <rect x="700" y="68" width="106" height="159" rx="6" fill="none" stroke="#B5C0CA" stroke-width="1"/>

  <rect x="336" y="252" width="488" height="176" rx="10" fill="#DCF1EE" stroke="#0D7A6F" stroke-width="1.5"/>
  <text x="356" y="290" font-size="24" fill="#15202A">Impact transient</text>
  <g font-size="16" fill="#5A6875">
    <text x="356" y="320">DYNA_VIBRA, Newmark</text>
    <text x="356" y="344">251 g pulse over 2.5 ms</text>
    <text x="356" y="368">3 directions, 30 ms, ζ = 5 %</text>
    <text x="356" y="392">von Mises 8 mm away from contact</text>
  </g>
  <image href="ov_hotspots.png" x="656" y="262" width="150" height="164"/>
  <rect x="656" y="262" width="150" height="164" rx="6" fill="none" stroke="#B5C0CA" stroke-width="1"/>

  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M274,200 C306,200 306,148 334,148"/>
    <path d="M274,200 C306,200 306,340 334,340"/>
    <path d="M824,148 L884,148"/>
    <path d="M824,340 C850,340 850,378 876,378"/>
  </g>

  <!-- outputs -->
  <image href="ov_campbell.png" x="886" y="60" width="274" height="176"/>
  <rect x="886" y="60" width="274" height="176" rx="6" fill="none" stroke="#B5C0CA" stroke-width="1"/>
  <text x="886" y="268" font-size="20" fill="#15202A">Mode 1: 35 to 44 Hz</text>
  <text x="886" y="302" font-size="24" fill="#B8461F">3 rotor-line crossings</text>
  <text x="886" y="326" font-size="16" fill="#5A6875">at 2000 rpm, inside the E range</text>
  <line x1="886" y1="346" x2="1160" y2="346" stroke="#D0D7DE" stroke-width="1"/>
  <text x="886" y="388" font-size="26" fill="#15202A">114 to 174 MPa</text>
  <text x="886" y="414" font-size="16" fill="#5A6875">local peaks, arm and stand joints</text>

  <!-- band -->
  <image href="ov_convergence.png" x="40" y="496" width="114" height="109"/>
  <rect x="40" y="496" width="114" height="109" rx="6" fill="none" stroke="#B5C0CA" stroke-width="1"/>
  <text x="170" y="522" font-size="18" fill="#15202A">Mesh study</text>
  <text x="170" y="548" font-size="16" fill="#5A6875">TETRA10 within 1 % on 4 meshes</text>
  <text x="170" y="572" font-size="16" fill="#5A6875">TETRA4 still falling with refinement</text>

  <image href="ov_shock.png" x="472" y="496" width="323" height="109"/>
  <rect x="472" y="496" width="323" height="109" rx="6" fill="none" stroke="#B5C0CA" stroke-width="1"/>
  <text x="812" y="522" font-size="18" fill="#15202A">Transient checks</text>
  <text x="812" y="548" font-size="16" fill="#5A6875">Δt halved: at most 0.4 % change</text>
  <text x="812" y="572" font-size="16" fill="#5A6875">runs to 60 ms: no higher peak</text>
</svg>
